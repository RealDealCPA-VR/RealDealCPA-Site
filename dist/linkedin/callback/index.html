<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>LinkedIn OAuth Callback</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; background: #fafaf7; color: #111; }
      body { font-family: Georgia, serif; }
      main { max-width: 800px; margin: 48px auto; padding: 0 20px; }
      h1 { font-weight: 700; margin: 0 0 12px; }
      label { display: block; font-weight: 700; margin-bottom: 8px; }
      textarea, input {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #d4d4d0;
        background: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
        box-sizing: border-box;
      }
      textarea { min-height: 120px; resize: vertical; }
      .row { margin-top: 24px; }
      .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
      button {
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #111;
        background: #111;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary { background: #fff; color: #111; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      pre {
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        background: #111;
        color: #f5f5f0;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .err { color: #b42318; }
      .hint { color: #555; font-size: 13px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>LinkedIn OAuth Callback</h1>
      <p id="status">Reading callback…</p>
      <p id="error" class="err" hidden></p>

      <div class="row">
        <label for="full-url">Full callback URL</label>
        <textarea id="full-url" readonly></textarea>
      </div>

      <div class="row">
        <label for="code">Authorization code</label>
        <input id="code" readonly />
      </div>

      <div class="actions">
        <button id="copy-url" type="button">Copy Callback URL</button>
        <button id="copy-code" type="button" class="secondary">Copy Code Only</button>
        <span id="copy-hint" class="hint" aria-live="polite"></span>
      </div>

      <pre id="next-command" hidden></pre>
    </main>

    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var errorEl = document.getElementById("error");
        var fullUrlEl = document.getElementById("full-url");
        var codeEl = document.getElementById("code");
        var copyUrlBtn = document.getElementById("copy-url");
        var copyCodeBtn = document.getElementById("copy-code");
        var copyHint = document.getElementById("copy-hint");
        var nextCmdEl = document.getElementById("next-command");

        var href = window.location.href;
        var url = new URL(href);
        var code = url.searchParams.get("code") || "";
        var err = url.searchParams.get("error") || "";
        var desc = url.searchParams.get("error_description") || "";

        fullUrlEl.value = href;
        codeEl.value = code;

        if (err) {
          statusEl.textContent = "LinkedIn returned an error.";
          errorEl.textContent = err + (desc ? ": " + desc : "");
          errorEl.hidden = false;
        } else if (code) {
          statusEl.textContent =
            "Authorization received. Copy the full callback URL and exchange it locally.";
        } else {
          statusEl.textContent = "No authorization code found in this URL.";
        }

        if (href) {
          var safeHref = href.replace(/"/g, '\\"');
          nextCmdEl.textContent =
            'python3 ~/clawd/scripts/linkedin_poster.py exchange-url "' + safeHref + '"';
          nextCmdEl.hidden = false;
        }

        copyCodeBtn.disabled = !code;

        function copy(text, label) {
          if (!text) return;
          var done = function () {
            copyHint.textContent = "Copied " + label + ".";
            window.setTimeout(function () {
              copyHint.textContent = "";
            }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () {
              fallbackCopy(text);
              done();
            });
          } else {
            fallbackCopy(text);
            done();
          }
        }

        function fallbackCopy(text) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta);
        }

        copyUrlBtn.addEventListener("click", function () {
          copy(fullUrlEl.value, "callback URL");
        });
        copyCodeBtn.addEventListener("click", function () {
          copy(codeEl.value, "code");
        });
      })();
    </script>
  </body>
</html>
